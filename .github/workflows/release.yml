# A Jarvis felhős kiadás-építése. Ez a nyilvános `jarvis-app` repó workflow-ja: a privát forrást (`jarvis-rs`) a
# SOURCE_TOKEN titokkal húzza le, az aláíró kulcs titok (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]).
# Leírás (a jarvis-rs repóban): docs/RELEASE.md "Felhős kiadás".
#
# Indítás: tag a jarvis-app repóban (v<verzió>), vagy kézzel (Actions → release → Run workflow; alapból nem publikál).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "A jarvis-rs ág/tag/commit, amiből építünk (tagre indulva a tag neve)"
        default: main
      publish:
        description: "Kiadás közzététele (különben csak épít, és a csomag letölthető artifactként)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}   # kézi próbánál az új futás leváltja a régit; tagnél nem

permissions:
  contents: write   # a kiadás létrehozásához (a jarvis-app repóban)

env:
  SOURCE_REPO: KriszKecskes/jarvis-rs
  SOURCE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.source_ref }}

jobs:
  plan:
    # Tagre: melyik platformcsomag hiányzik még a kiadásból? Csak azokat építjük (egy félbemaradt kiadás kiegészítése, vagy
    # egy új platform hozzáadása nem épít újra mindent). Kézi indításnál mindig mindent épít.
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.p.outputs.windows }}
      macos: ${{ steps.p.outputs.macos }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for k in windows macos; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
          [ "${{ github.event_name }}" = "push" ] || exit 0
          TAG="${{ github.ref_name }}"; V="${TAG#v}"
          ASSETS="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          has() { printf '%s\n' "$ASSETS" | grep -qx "$1"; }
          has "Jarvis_${V}_windows-x86_64.exe"         && echo "windows=false" >> "$GITHUB_OUTPUT"
          has "Jarvis_${V}_darwin-aarch64.app.tar.gz"  && echo "macos=false"   >> "$GITHUB_OUTPUT"
          echo "Már kint van:"; printf '%s\n' "$ASSETS"

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    # A Visual Studio, a Ninja, az LLVM és a Python a futtatón rajta van; a Vulkan SDK-t (glslc + fejlécek) mi tesszük fel.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: C:\jt            # rövid útvonal: a whisper.cpp shader-építése különben átlépi a 260 karaktert
      CMAKE_GENERATOR: Ninja
      VULKAN_VERSION: 1.3.296.0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: C:\jt

      - name: MSVC-környezet (cl, link a PATH-on)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $dir = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path $dir)) {
            $exe = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe" -OutFile $exe
            $p = Start-Process $exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "A Vulkan SDK telepítése nem sikerült ($($p.ExitCode))" }
          }
          # Az SDK nem hozza a vulkan-1.dll-t, videokártya nélküli futtatón a System32-ben sincs, a Runtime telepítője pedig
          # csendes módban is lefagy: a Khronos betöltőjét (Vulkan-Loader, az SDK-val azonos verzió) magunk fordítjuk, és az SDK
          # Bin mappájába tesszük, ahonnan a windows-stage.ps1 a telepítőbe másolja.
          if (-not (Test-Path "$dir\Bin\vulkan-1.dll")) {
            $src = Join-Path $env:RUNNER_TEMP 'vkloader'
            git clone --quiet --depth 1 --branch "vulkan-sdk-$env:VULKAN_VERSION" https://github.com/KhronosGroup/Vulkan-Loader.git $src
            if ($LASTEXITCODE) { throw 'A Vulkan-Loader klónozása nem sikerült' }
            cmake -S $src -B "$src\build" -G Ninja -D CMAKE_BUILD_TYPE=Release -D UPDATE_DEPS=ON -D BUILD_TESTS=OFF
            if ($LASTEXITCODE) { throw 'A Vulkan-Loader beállítása nem sikerült' }
            cmake --build "$src\build" --target vulkan
            if ($LASTEXITCODE) { throw 'A Vulkan-Loader fordítása nem sikerült' }
            $dll = Get-ChildItem "$src\build" -Recurse -Filter vulkan-1.dll | Select-Object -First 1
            if (-not $dll) { throw 'A Vulkan-Loader fordítása után nincs vulkan-1.dll' }
            Copy-Item $dll.FullName "$dir\Bin\vulkan-1.dll"
          }
          Get-Item "$dir\Bin\vulkan-1.dll" | ForEach-Object { "$($_.FullName) $($_.Length)" }
          "VULKAN_SDK=$dir" >> $env:GITHUB_ENV
          "$dir\Bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: A Git saját link.exe-je ne takarja az MSVC linkerét
        shell: pwsh
        run: |
          $l = 'C:\Program Files\Git\usr\bin\link.exe'
          if (Test-Path $l) { Remove-Item $l -Force }

      - name: tauri-cli
        shell: pwsh
        run: cargo install tauri-cli --version '^2' --locked

      - name: Verzió ellenőrzése (a tag és a Cargo.toml egyezzen)
        shell: bash
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="jarvis-app"))')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ] && [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "A tag (${{ github.ref_name }}) nem egyezik a Cargo.toml verziójával (v$VERSION)." >&2
            exit 1
          fi

      - name: Összetevők (hang-sidecar, DLL-ek, app)
        shell: powershell
        run: scripts\windows-stage.ps1

      - name: Aláírt NSIS-telepítő
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts\windows-installer.ps1

      - name: Csomag és a latest.json részlete
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/release/$VERSION"
          NAME="Jarvis_${VERSION}_windows-x86_64.exe"
          SRC="$(cygpath -u 'C:\jt')/release/bundle/nsis/Jarvis_${VERSION}_x64-setup.exe"
          [ -f "$SRC" ] && [ -f "$SRC.sig" ] || { echo "Hiányzik a telepítő vagy az aláírása: $SRC(.sig)" >&2; exit 1; }
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/$NAME"
          python tools/release_manifest.py part "$OUT" windows-x86_64 "$NAME" "$SRC.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/${{ env.VERSION }}/*
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    # Apple Silicon (arm64) futtató: ugyanaz a scripts/release.sh, mint kézzel; a hang-sidecar Metallal épül.
    # Intel Mac nem készül; a csomag aláíratlan (Gatekeeper), csak az updater-aláírása van meg.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rendszercsomagok (hangmodul)
        run: brew install cmake espeak-ng

      - name: tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Verzió ellenőrzése (a tag és a Cargo.toml egyezzen)
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="jarvis-app"))')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ] && [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "A tag (${{ github.ref_name }}) nem egyezik a Cargo.toml verziójával (v$VERSION)." >&2
            exit 1
          fi

      - name: Aláírt csomag építése
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/jarvis.key"
          TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/jarvis.key" scripts/release.sh
          rm -f "$RUNNER_TEMP/jarvis.key"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/${{ env.VERSION }}/*
          if-no-files-found: error

  flatpak:
    # A Flatpak-tároló: aláírt OSTree-tároló a nyilvános `jarvis-flatpak` repóban (GitHub Pages) – ez adja a Linuxos
    # önfrissítést (`flatpak update`). A tároló korábbi tartalmához hozzáfűz (a régi verziók/deltok megmaradnak, a
    # `--prune-depth` metszi), a repó története minden kiadásnál egyetlen commitra tömörül (a Pages mérete számít, nem a
    # történet). Titkok: FLATPAK_GPG_PRIVATE_KEY (+ _PASSPHRASE), FLATPAK_DEPLOY_KEY (írási deploy key a jarvis-flatpak-ra).
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FLATPAK_REPO: KriszKecskes/jarvis-flatpak
    steps:
      - name: Hely felszabadítása (a hangmodul fordítása sokat foglal)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0

      - name: Verzió ellenőrzése (a tag és a Cargo.toml egyezzen)
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ] && [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "A tag (${{ github.ref_name }}) nem egyezik a Cargo.toml verziójával (v$VERSION)." >&2
            exit 1
          fi

      - name: Flatpak-eszközök
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils gnupg gpg-agent
          # az Ubuntu 24.04 alapból tiltja a felhasználói névtereket, a bwrap-nak (flatpak-builder) kellenek
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: A tároló korábbi tartalma
        env:
          DEPLOY_KEY: ${{ secrets.FLATPAK_DEPLOY_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/flatpak_deploy
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/flatpak_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/flatpak_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 "git@github.com:${FLATPAK_REPO}.git" "$RUNNER_TEMP/flatpak-repo"

      - name: A kiadás verziója a metaadatban
        run: |
          sed -i "s#<release version=\"[^\"]*\" date=\"[^\"]*\"/>#<release version=\"$VERSION\" date=\"$(date -u +%F)\"/>#" \
            installer/flatpak/hu.jarvis.app.metainfo.xml
          grep release installer/flatpak/hu.jarvis.app.metainfo.xml

      - name: Flatpak építése (a meglévő tárolóba)
        env:
          FLATPAK_BUILDER: flatpak-builder
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
          FLATPAK_BUILD_DIR: ${{ runner.temp }}/fpbuild
          FLATPAK_REPO_DIR: ${{ runner.temp }}/flatpak-repo
        run: installer/flatpak/build.sh

      - name: Aláírás (a kulcs jelszava a gpg-agent gyorsítótárába kerül, nem fájlba)
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m700 "$GNUPGHOME"
          echo "allow-preset-passphrase" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpgconf --kill gpg-agent; gpgconf --launch gpg-agent
          for grip in $(gpg --list-secret-keys --with-keygrip --with-colons | awk -F: '/^grp/{print $10}'); do
            /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "$GPG_PASS" "$grip"
          done
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          echo "Kulcs: $KEYID"
          JARVIS_FLATPAK_KEY="$KEYID" installer/flatpak/sign-repo.sh "$RUNNER_TEMP/flatpak-repo"
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"

      - name: Közzététel a jarvis-flatpak-ba (csak tagre vagy kérésre, egyetlen commit)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/flatpak-repo"
          rm -rf tmp state .lock
          cp -a "$GITHUB_WORKSPACE"/installer/flatpak/site/. .
          git checkout -q --orphan publish
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Jarvis $VERSION (stable)"
          git push --force origin publish:main

      - name: Ellenőrzés (mi került fel)
        run: |
          cd "$RUNNER_TEMP/flatpak-repo"
          git log --format='%h %an: %s' | head -1
          du -sh --exclude=.git . | cut -f1
          ls refs/heads/app/hu.jarvis.app/*/

  publish:
    needs: [plan, windows, macos]
    # tagre automatikusan; kézi indításnál csak ha kérték; a kihagyott (már kint lévő) platform jobja nem akasztja meg
    # a megszakadt (pl. a macOS-futtató kapacitáshiánya miatt) és az elbukott job is megállítja; csak a kihagyott (már kint
    # lévő platform) nem
    if: ${{ always() && (github.event_name == 'push' || inputs.publish) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: parts

      - name: latest.json és a kiadás
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          mkdir -p out
          if ! ls parts/*/* >/dev/null 2>&1; then echo "Nincs új csomag: minden platform már kint van."; exit 0; fi
          cp parts/*/* out/
          # a jegyzet a jarvis-rs tag üzenete (git tag -a vX.Y.Z -m "…"); a könnyűsúlyú tagnél a commit üzenete
          NOTES="$(git for-each-ref --format='%(contents)' "refs/tags/v$VERSION" | sed '/^-----BEGIN PGP/,$d')"
          [ -n "$NOTES" ] || NOTES="Jarvis $VERSION"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # már van kiadás: a benne lévő platformok bejegyzése megmarad (új részlet nélkül), az újak hozzáadódnak
            gh release download "v$VERSION" --repo "${{ github.repository }}" -p latest.json -D old --clobber 2>/dev/null || true
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          old = Path("old/latest.json")
          if old.exists():
              for platform, e in json.loads(old.read_text()).get("platforms", {}).items():
                  part = Path(f"out/part-{platform}.json")
                  if not part.exists():
                      part.write_text(json.dumps({platform: {"signature": e["signature"], "name": e["url"].rsplit("/", 1)[1]}}))
          PY
            python3 tools/release_manifest.py merge out "$VERSION" "${{ github.repository }}" "$NOTES"
            gh release upload "v$VERSION" --repo "${{ github.repository }}" --clobber $(ls out/Jarvis_* out/latest.json)
          else
            python3 tools/release_manifest.py merge out "$VERSION" "${{ github.repository }}" "$NOTES"
            gh release create "v$VERSION" --repo "${{ github.repository }}" --title "Jarvis $VERSION" --notes "$NOTES" $(ls out/Jarvis_* out/latest.json)
          fi
