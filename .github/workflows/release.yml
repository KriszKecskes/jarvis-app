# A Jarvis felhős kiadás-építése. EZ A FÁJL A `jarvis-app` (nyilvános) REPÓBAN FUT: ott `.github/workflows/release.yml`
# néven él; a forrása a `jarvis-rs`-ben van (`.github/jarvis-app/release.yml`, ez inert: az Actions csak a workflows/
# mappát nézi). A privát forrást a SOURCE_TOKEN titokkal húzza le, az aláíró kulcs titok (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]).
# Leírás: docs/RELEASE.md "Felhős kiadás".
#
# Indítás: tag a jarvis-app repóban (v<verzió>), vagy kézzel (Actions → release → Run workflow; alapból nem publikál).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "A jarvis-rs ág/tag/commit, amiből építünk (tagre indulva a tag neve)"
        default: main
      publish:
        description: "Kiadás közzététele (különben csak épít, és a csomag letölthető artifactként)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # a kiadás létrehozásához (a jarvis-app repóban)

env:
  SOURCE_REPO: KriszKecskes/jarvis-rs
  SOURCE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.source_ref }}

jobs:
  linux:
    runs-on: ubuntu-22.04   # régebbi glibc: az AppImage az újabb disztrókon is fut
    steps:
      - name: Hely felszabadítása (a hangmodul fordítása sokat foglal)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rendszercsomagok (Tauri + hangmodul)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf \
            cmake clang libclang-dev libvulkan-dev glslc libasound2-dev libespeak-ng-dev

      - name: tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Verzió ellenőrzése (a tag és a Cargo.toml egyezzen)
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="jarvis-app"))')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ] && [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "A tag (${{ github.ref_name }}) nem egyezik a Cargo.toml verziójával (v$VERSION)." >&2
            exit 1
          fi

      - name: Aláírt csomag építése
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"   # a futtatón nincs FUSE: a linuxdeploy kicsomagolva fut
          NO_STRIP: "true"
        run: |
          umask 077
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/jarvis.key"
          TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/jarvis.key" scripts/release.sh
          rm -f "$RUNNER_TEMP/jarvis.key"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/${{ env.VERSION }}/*
          if-no-files-found: error

  publish:
    needs: [linux]
    # tagre automatikusan; kézi indításnál csak ha kérték
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: parts

      - name: latest.json és a kiadás
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          mkdir -p out
          cp parts/*/* out/
          # a jegyzet a jarvis-rs tag üzenete (git tag -a vX.Y.Z -m "…"); a könnyűsúlyú tagnél a commit üzenete
          NOTES="$(git for-each-ref --format='%(contents)' "refs/tags/v$VERSION" | sed '/^-----BEGIN PGP/,$d')"
          [ -n "$NOTES" ] || NOTES="Jarvis $VERSION"
          python3 tools/release_manifest.py merge out "$VERSION" "${{ github.repository }}" "$NOTES"
          FILES=$(ls out/Jarvis_* out/latest.json)
          gh release create "v$VERSION" --repo "${{ github.repository }}" --title "Jarvis $VERSION" --notes "$NOTES" $FILES
